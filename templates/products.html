{% extends "base.html" %}
{% block content %}
<h2>Your Products</h2>
<a href="{{ url_for('main.add_product') }}" class="btn btn-primary mb-3">Add Product</a>
<table class="table">
    <thead>
        <tr><th>ID</th><th>Name</th><th>Category</th></tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>{{ product.category }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
